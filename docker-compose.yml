services:
  postgres:
    image: postgres:16
    container_name: gateway-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway

    ports:
      - "55432:5432"

    volumes:
      - gateway_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - gateway_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gateway_postgres_data:
  gateway_redis_data: