openapi: 3.1.0
info:
  title: Enterprise AI & API Gateway
  version: 1.2.0
  summary: Final executable HTTP contract for Enterprise AI & API Gateway V1
  description: Derived from PRD V1.4, HLD V1.1 corrections, ERD V1.2 Final, Physical DB/Alembic V1.2 Final, API Specification
    V1.2.2 Final, frozen M0-M9 execution contracts, and the M2.6 Normal API Registry Contract Reconciliation addendum.
    This artifact consolidates final V1 semantics for Normal API, OpenAI-compatible LLM, Admin browser sessions,
    traffic-admission health, idempotency, certification, credential invalidation, SSRF/TLS and SSE.
servers:
- url: https://gateway.example.com
  description: Production example
security: []
tags:
- name: Health
- name: LLM Data Plane
- name: Applications
- name: API Keys
- name: Services
- name: Routes
- name: LLM Registry
- name: Rate Limits
- name: Pricing
- name: Audit
- name: Configuration
- name: Admin Session
paths:
  /health/live:
    get:
      tags:
      - Health
      operationId: getLiveness
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      description: Process/event-loop liveness only; no PostgreSQL, Redis, provider or upstream dependency calls.
  /health/ready:
    get:
      tags:
      - Health
      operationId: getReadiness
      summary: Dependency readiness diagnostic
      security: []
      responses:
        '200':
          description: Instance is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      description: PostgreSQL SELECT 1 + Redis PING concurrently, each with 1s bound. Diagnostic/alerting endpoint; not the
        orchestrator traffic-membership probe.
  /v1/models:
    get:
      tags:
      - LLM Data Plane
      operationId: listModels
      summary: List aliases/models invokable by the current API key
      security:
      - GatewayApiKey: []
      responses:
        '200':
          description: OpenAI-compatible model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/chat/completions:
    post:
      tags:
      - LLM Data Plane
      operationId: createChatCompletion
      summary: Create an OpenAI-compatible chat completion
      security:
      - GatewayApiKey: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: 'stream=false => JSON ChatCompletionResponse. stream=true => real SSE. Semantic output commits only
            after first non-empty assistant content delta or meaningful tool-call delta is successfully written. Role-only,
            usage-only, empty delta and Gateway heartbeat do not commit. Success emits exactly one data: [DONE]. After output
            commit retry/fallback is forbidden; writable post-commit failures emit event:error then close with no [DONE].
            Default provider idle timeouts: 20s pre-output, 60s post-output; default total pre-output retry/fallback budget:
            30s.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: OpenAI-compatible SSE stream.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderError'
        '503':
          $ref: '#/components/responses/AllTargetsUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/applications:
    get:
      tags:
      - Applications
      operationId: listApplications
      summary: List applications
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Application page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Applications
      operationId: createApplication
      summary: Create application
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/OptionalIdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '409':
          $ref: '#/components/responses/ResourceConflict'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/applications/{application_id}:
    parameters:
    - $ref: '#/components/parameters/ApplicationId'
    get:
      tags:
      - Applications
      operationId: getApplication
      security:
      - AdminToken: []
      responses:
        '200':
          description: Application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Applications
      operationId: updateApplication
      security:
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPatch'
      responses:
        '200':
          description: Updated application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '409':
          $ref: '#/components/responses/ResourceConflict'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: Updates application metadata/status. Committed DISABLED status makes all owned gw_ credentials unauthorized
        within <=5 seconds. Session-authenticated mutation requires X-CSRF-Token.
  /api/v1/admin/api-keys:
    get:
      tags:
      - API Keys
      operationId: listApiKeys
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: API key metadata page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPage'
    post:
      tags:
      - API Keys
      operationId: createApiKey
      summary: Create API key; raw secret is shown once
      description: 'Idempotency-Key is mandatory.


        When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.'
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/RequiredIdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyCreate'
      responses:
        '201':
          description: Raw gw_ key is returned only in this response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '409': &id001
          description: Idempotency conflict or same operation currently IN_PROGRESS. Inspect normalized error.code. Retry-After
            is present for idempotency_in_progress.
          headers:
            Retry-After:
              description: Present for idempotency_in_progress; V1 value is 1 second. May be omitted for idempotency_conflict.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/api-keys/{api_key_id}/revoke:
    post:
      tags:
      - API Keys
      operationId: revokeApiKey
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/ApiKeyId'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Revoked key metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyMetadata'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Committed revoke becomes authorization-effective on the Data Plane within <=5 seconds via targeted invalidation
        plus dedicated credential security-status revalidation. Session-authenticated mutation requires X-CSRF-Token.
  /api/v1/admin/api-keys/{api_key_id}/permissions:
    parameters:
    - $ref: '#/components/parameters/ApiKeyId'
    get:
      tags:
      - API Keys
      operationId: listApiKeyPermissions
      security:
      - AdminToken: []
      responses:
        '200':
          description: Permission list
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKeyPermission'
    put:
      tags:
      - API Keys
      operationId: replaceApiKeyPermissions
      security:
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - permissions
              additionalProperties: false
              properties:
                permissions:
                  type: array
                  items:
                    $ref: '#/components/schemas/ApiKeyPermissionWrite'
      responses:
        '200':
          description: Permission set replaced atomically
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/services:
    get:
      tags:
      - Services
      operationId: listServices
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Service list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
    post:
      tags:
      - Services
      operationId: createService
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/OptionalIdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '409':
          $ref: '#/components/responses/ResourceConflict'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/services/{service_id}:
    parameters:
    - $ref: '#/components/parameters/ServiceId'
    get:
      tags:
      - Services
      operationId: getService
      security:
      - AdminToken: []
      responses:
        '200':
          description: Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Services
      operationId: updateService
      security:
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePatch'
      responses:
        '200':
          description: Updated service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '409':
          $ref: '#/components/responses/ResourceConflict'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/services/{service_id}/credential:
    put:
      tags:
      - Services
      operationId: rotateServiceCredential
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/OptionalIdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCredentialWrite'
      responses:
        '200':
          description: Credential metadata; secret never returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMetadata'
        '409':
          $ref: '#/components/responses/ActiveCredentialConflict'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/routes:
    get:
      tags:
      - Routes
      operationId: listRoutes
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Route list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutePage'
    post:
      tags:
      - Routes
      operationId: createRoute
      summary: Create route after deterministic overlap validation
      security:
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteCreate'
      responses:
        '201':
          description: Route created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '409':
          $ref: '#/components/responses/RouteConflict'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/routes/{route_id}:
    parameters:
    - $ref: '#/components/parameters/RouteId'
    get:
      tags:
      - Routes
      operationId: getRoute
      security:
      - AdminToken: []
      responses:
        '200':
          description: Route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Routes
      operationId: updateRoute
      summary: Update/enable/disable route after overlap validation
      security:
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutePatch'
      responses:
        '200':
          description: Updated route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '409':
          $ref: '#/components/responses/RouteConflict'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/llm/providers:
    get:
      tags:
      - LLM Registry
      operationId: listLlmProviders
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Provider list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProviderPage'
    post:
      tags:
      - LLM Registry
      operationId: createLlmProvider
      security:
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmProviderCreate'
      responses:
        '201':
          description: Provider created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/llm/targets:
    get:
      tags:
      - LLM Registry
      operationId: listLlmTargets
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Target list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmTargetPage'
    post:
      tags:
      - LLM Registry
      operationId: createLlmTarget
      security:
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmTargetCreate'
      responses:
        '201':
          description: Target created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmTarget'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/llm/targets/{target_id}/credential:
    put:
      tags:
      - LLM Registry
      operationId: rotateLlmTargetCredential
      summary: Atomically rotate provider credential
      description: 'Idempotency-Key is mandatory.


        When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.'
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/TargetId'
      - $ref: '#/components/parameters/RequiredIdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCredentialWrite'
      responses:
        '200':
          description: Credential metadata only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMetadata'
        '409': *id001
  /api/v1/admin/llm/models:
    get:
      tags:
      - LLM Registry
      operationId: listLlmModels
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmModelPage'
    post:
      tags:
      - LLM Registry
      operationId: createLlmModel
      security:
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmModelCreate'
      responses:
        '201':
          description: Model created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmModel'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/llm/models/{model_id}/capabilities:
    put:
      tags:
      - LLM Registry
      operationId: replaceModelCapabilities
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/ModelId'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - capabilities
              additionalProperties: false
              properties:
                capabilities:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/ModelCapability'
      responses:
        '200':
          description: Capability set replaced
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/llm/aliases:
    get:
      tags:
      - LLM Registry
      operationId: listLlmAliases
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Alias list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmAliasPage'
    post:
      tags:
      - LLM Registry
      operationId: createLlmAlias
      security:
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmAliasCreate'
      responses:
        '201':
          description: Alias created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmAlias'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/llm/aliases/{alias_id}/targets:
    put:
      tags:
      - LLM Registry
      operationId: replaceAliasTargets
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/AliasId'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targets
              additionalProperties: false
              properties:
                targets:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/AliasTargetWrite'
      responses:
        '200':
          description: Ordered target set replaced atomically
        '409':
          $ref: '#/components/responses/ResourceConflict'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/rate-limits/{scope_type}/{scope_id}:
    parameters:
    - $ref: '#/components/parameters/RateScopeType'
    - $ref: '#/components/parameters/ScopeId'
    get:
      tags:
      - Rate Limits
      operationId: getRateLimitPolicy
      security:
      - AdminToken: []
      - AdminSessionCookie: []
      responses:
        '200':
          description: Enabled policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitPolicy'
        '404':
          $ref: '#/components/responses/NotFound'
      description: '`ADMIN_TOKEN` scope is post-auth per-specific-Admin-Token throttling only. It does not configure the separate
        pre-auth `ADMIN_AUTH_PROTECTED` IP + Admin-auth-path-class brute-force guard.'
    put:
      tags:
      - Rate Limits
      operationId: upsertRateLimitPolicy
      security:
      - AdminToken: []
      - AdminSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateLimitPolicyWrite'
      responses:
        '200':
          description: Policy upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitPolicy'
        '409':
          $ref: '#/components/responses/ResourceConflict'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: 'When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.


        `ADMIN_TOKEN` scope is post-auth per-specific-Admin-Token throttling only. It does not configure the separate pre-auth
        `ADMIN_AUTH_PROTECTED` IP + Admin-auth-path-class brute-force guard.'
    delete:
      tags:
      - Rate Limits
      operationId: deleteRateLimitPolicy
      security:
      - AdminToken: []
      - AdminSessionCookie: []
      responses:
        '204':
          description: Policy disabled/removed
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: 'When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.


        `ADMIN_TOKEN` scope is post-auth per-specific-Admin-Token throttling only. It does not configure the separate pre-auth
        `ADMIN_AUTH_PROTECTED` IP + Admin-auth-path-class brute-force guard.'
  /api/v1/admin/llm/models/{model_id}/prices:
    parameters:
    - $ref: '#/components/parameters/ModelId'
    get:
      tags:
      - Pricing
      operationId: listModelPrices
      security:
      - AdminToken: []
      responses:
        '200':
          description: Price windows
    post:
      tags:
      - Pricing
      operationId: createModelPrice
      security:
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
