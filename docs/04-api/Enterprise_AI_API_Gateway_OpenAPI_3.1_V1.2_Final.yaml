              $ref: '#/components/schemas/LlmProviderPatch'
      responses:
        '200':
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmProvider'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/llm/models/{model_id}:
    parameters:
    - $ref: '#/components/parameters/ModelId'
    get:
      tags:
      - LLM Models
      summary: Get LLM model
      operationId: getLlmModel
      security:
      - AdminToken: []
      responses:
        '200':
          description: Model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - LLM Models
