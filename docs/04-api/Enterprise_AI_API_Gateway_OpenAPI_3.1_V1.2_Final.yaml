x-gateway:
  normal-api-dynamic-proxy:
    basePath: /api/{service}/{remaining_path}
    serviceParameter: tenant-scoped immutable services.slug
    methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    authentication: GatewayApiKey
    defaultRequestBodyLimitBytes: 10485760
    timeoutsMs:
      connect: 5000
      pool: 5000
      write: 30000
      readIdle: 60000
      preResponseOverall: 120000
    activeStreamAbsoluteTimeout: false
    redirectsFollowed: false
    rules:
    - Preserve query multiplicity/order where transport permits; do not double-decode traversal.
    - Strip hop-by-hop headers; rebuild Host; inject canonical UUID v7 X-Request-ID.
    - Client gw_ Authorization is never forwarded; upstream credentials are injected after filtering.
    - Configurable outbound target passes centralized SSRF/DNS/TLS validation.
  llm-streaming:
    successTerminator: 'data: [DONE]'
    outputCommit: first successfully written non-empty assistant content delta or meaningful tool-call delta
    nonCommitEvents:
    - role-only
    - usage-only
    - empty delta
    - gateway heartbeat
    heartbeatComment: ': ping'
    heartbeatIntervalSeconds: 15
    postCommitFallbackAllowed: false
    midStreamErrorEvent: error
    midStreamDoneAfterError: false
    preOutputIdleTimeoutMs: 20000
    preOutputBudgetMs: 30000
    preOutputBudgetMaxMs: 120000
    postOutputIdleTimeoutMs: 60000
    sameTargetMaxRetriesBeforeOutput: 1
    retryDelayMs: 100
  idempotency:
    retentionHours: 24
    correctnessStore: PostgreSQL
    concurrentInProgress:
      status: 409
      code: idempotency_in_progress
      retryAfterSeconds: 1
    requiredOperations:
    - createApiKey
    - rotateLlmTargetCredential
  credential-status:
    adminMaxStalenessSeconds: 5
    gatewayApiKeyAndApplicationMaxStalenessSeconds: 5
    strictModeTtlSeconds: 0
    generalConfigCacheMayAuthorizeRevokedCredential: false
  health-probes:
    liveness: /health/live
    trafficAdmission: /health/traffic
    dependencyReadiness: /health/ready
  admin-auth-protection:
    adminTokenRatePolicy: post-auth per resolved Admin Token
    preAuthGuard: ADMIN_AUTH_PROTECTED keyed by client IP + shared Admin-auth path class
    preAuthGuardConfigurableViaRateLimitApi: false
  egress-security:
    sharedBy:
    - Normal API
    - LLM provider targets
    redirectsFollowed: false
    productionTlsVerify: true
    customCaSupported: true
    denyOwnManagementListeners: true
    denyMetadataIpv4LinkLocal: 169.254.0.0/16
    knownNonLinkLocalMetadataDeny:
    - 100.100.100.200
    dnsRebindingProtection: true
