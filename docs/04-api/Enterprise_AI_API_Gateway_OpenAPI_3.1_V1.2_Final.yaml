        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmModelPatch'
      responses:
        '200':
          description: Updated model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmModel'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /api/v1/admin/llm/aliases/{alias_id}:
    parameters:
    - $ref: '#/components/parameters/AliasId'
    get:
      tags:
      - LLM Aliases
      summary: Get LLM alias
      operationId: getLlmAlias
      security:
      - AdminToken: []
      responses:
        '200':
          description: Alias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmAlias'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - LLM Aliases
      summary: Update or disable LLM alias
      operationId: updateLlmAlias
      security:
      - AdminToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmAliasPatch'
      responses:
        '200':
          description: Updated alias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmAlias'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: When authenticated by AdminSessionCookie, X-CSRF-Token is mandatory. Supplying both AdminToken and AdminSessionCookie
        is rejected as ambiguous credentials.
  /health/traffic:
    get:
      tags:
      - Health
      operationId: getTrafficAdmission
      summary: Traffic-admission probe
      description: Infrastructure readiness/load-balancer membership probe. Redis degradation alone remains accepting while
        conservative protection is functional.
      security: []
      responses:
        '200':
          description: Instance may receive new Data Plane traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Instance is draining or unsafe for new Data Plane traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/admin/llm/targets/{target_id}:
    parameters:
    - $ref: '#/components/parameters/TargetId'
    get:
      tags:
      - LLM Registry
      operationId: getLlmTarget
      security:
      - AdminToken: []
      responses:
        '200':
          description: Provider target metadata including certification and Experimental override; no credential plaintext.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmTarget'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - LLM Registry
      operationId: updateLlmTarget
      security:
      - AdminToken: []
      description: Updates mutable target fields. When session-authenticated, X-CSRF-Token is mandatory. Certification result
        fields and credentials cannot be arbitrarily set here.
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmTargetPatch'
      responses:
        '200':
          description: Updated target
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmTarget'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
  /api/v1/admin/session/login:
    post:
      tags:
      - Admin Session
      operationId: loginAdminSession
      security: []
      description: Pre-auth ADMIN_AUTH_PROTECTED guard applies. Exchanges an already-issued adm_ token for a fresh opaque
        Redis-backed browser session. No Admin Token lifecycle is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSessionLoginRequest'
      responses:
        '204':
          description: Session created; raw adm_ is not echoed. Client should call GET /api/v1/admin/session for safe bootstrap
            metadata.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: gw_admin_session opaque cookie; HttpOnly; Secure in production; SameSite=Strict; host-only; Path=/api/v1/admin.
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/session:
    get:
      tags:
      - Admin Session
      operationId: getAdminSession
      security:
      - AdminSessionCookie: []
      responses:
        '200':
          description: Safe current Admin/session bootstrap metadata; no raw credentials.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/session/logout:
    post:
      tags:
      - Admin Session
      operationId: logoutAdminSession
      security:
      - AdminSessionCookie: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: Requires browser session + matching X-CSRF-Token. Invalidates Redis session and expires cookie.
      responses:
        '204':
          description: Session invalidated
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Expires gw_admin_session cookie.
            Cache-Control:
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/admin/model-prices/{price_id}:
    parameters:
    - $ref: '#/components/parameters/PriceId'
    patch:
      tags:
      - Pricing
      operationId: updateModelPrice
      security:
      - AdminToken: []
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      description: Adjust future/open price window subject to no-overlap exclusion constraint. Session-authenticated mutation
        requires X-CSRF-Token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPricePatch'
      responses:
        '200':
          description: Updated price window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPrice'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PriceWindowConflict'
components:
  securitySchemes:
    GatewayApiKey:
      type: http
      scheme: bearer
      bearerFormat: gw_<secret>
      description: Data Plane credential only.
    AdminToken:
      type: http
      scheme: bearer
      bearerFormat: adm_<secret>
      description: Per-admin Control Plane credential only.
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: gw_admin_session
      description: Opaque Redis-backed Admin browser session cookie. Fail-closed when session store is unavailable.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional client correlation value only. Gateway always generates and returns a canonical UUID v7 X-Request-ID.
      schema:
        type: string
        maxLength: 128
    RequiredIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Required. Same key + same canonical fingerprint replays the original committed outcome for 24h. Different
        fingerprint => 409 idempotency_conflict. Concurrent IN_PROGRESS => 409 idempotency_in_progress with Retry-After: 1.'
      schema:
        type: string
        minLength: 8
        maxLength: 128
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque server-generated cursor
      schema:
        type: string
    ApplicationId:
      name: application_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiKeyId:
      name: api_key_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ServiceId:
      name: service_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RouteId:
      name: route_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TargetId:
      name: target_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelId:
      name: model_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AliasId:
      name: alias_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ScopeId:
      name: scope_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RateScopeType:
      name: scope_type
      in: path
      required: true
      schema:
        type: string
        enum:
        - API_KEY
        - ROUTE
        - SERVICE
        - LLM_ALIAS
        - LLM_MODEL
        - PROVIDER_TARGET
        - ADMIN_TOKEN
    ProviderId:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required only when the operation is authenticated with AdminSessionCookie and the HTTP method is state-changing.
        Not required for direct Bearer adm_ authentication.
      schema:
        type: string
        minLength: 16
        maxLength: 512
    PriceId:
      name: price_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      $ref: '#/components/responses/_Unauthorized'
    _Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authorization failed or model not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found; cross-tenant references also return 404
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Gateway or provider rate limit
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 0
        X-RateLimit-Limit:
          schema:
            type: integer
            minimum: 0
        X-RateLimit-Remaining:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: Provider/gateway timeout including stream idle timeout
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderError:
      description: Provider failure normalized by Gateway
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Gateway internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ResourceConflict:
      description: Resource/configuration conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RouteConflict:
      description: Ambiguous ACTIVE route overlap
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ActiveCredentialConflict:
      description: ACTIVE credential invariant conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PriceWindowConflict:
      description: Overlapping price validity window
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: Same Idempotency-Key used with a different canonical payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AllTargetsUnavailable:
      description: All alias targets failed, were unavailable/open-circuit, or capability-ineligible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            exhausted:
              value:
                error:
                  message: No eligible LLM target is currently available.
                  type: all_targets_unavailable
                  param: null
                  code: all_targets_unavailable
                  metadata:
                    attempted_targets: 2
                    ineligible_targets: 1
                    last_error_code: provider_timeout
                request_id: req_123
    RequestTooLarge:
      description: Request body exceeds Gateway limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamUnavailable:
      description: Normal API upstream unavailable/circuit open before response commit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UpstreamTimeout:
      description: Normal API upstream timeout before response commit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyInProgress:
      description: Same idempotency operation is currently IN_PROGRESS
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Whole seconds; V1 returns 1.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - ready
          - not_ready
          - accepting
          - draining
        runtime_mode:
          type:
          - string
          - 'null'
          enum:
          - NORMAL
          - DEGRADED_REDIS
          - RECOVERING_REDIS
          - DRAINING
          - NOT_READY_DB
          - null
          description: Present only where meaningful; never exposes dependency addresses/topology.
    ErrorResponse:
      type: object
      required:
      - error
      - request_id
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - message
          - type
          - code
          additionalProperties: false
          properties:
            message:
              type: string
            type:
              type: string
              enum:
              - authentication_error
              - authorization_error
              - rate_limit_exceeded
              - invalid_request
              - resource_not_found
              - model_not_found
              - model_not_allowed
              - provider_timeout
              - provider_rate_limit
              - provider_unavailable
              - provider_authentication_error
              - provider_error
              - all_targets_unavailable
              - gateway_timeout
              - gateway_internal_error
              - resource_conflict
              - route_conflict
              - active_credential_conflict
              - price_window_conflict
              - idempotency_conflict
              - configuration_conflict
              - request_too_large
              - upstream_unavailable
              - upstream_timeout
              - idempotency_in_progress
            param:
              type:
              - string
              - 'null'
            code:
              type: string
            metadata:
              type: object
              additionalProperties: true
              description: Safe aggregate diagnostics only; no provider IDs, base URLs, credentials, or topology.
              properties:
                attempted_targets:
                  type: integer
                  minimum: 0
                ineligible_targets:
                  type: integer
                  minimum: 0
                last_error_code:
                  type:
                  - string
                  - 'null'
        request_id:
          type: string
          format: uuid
          description: Canonical Gateway-generated UUID v7.
    ModelList:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          const: list
        data:
          type: array
          items:
            type: object
            required:
            - id
            - object
            - owned_by
            properties:
              id:
                type: string
              object:
                type: string
                const: model
              owned_by:
                type: string
                const: gateway
    ToolDefinition:
      type: object
      required:
      - type
      - function
      properties:
        type:
          type: string
          const: function
        function:
          type: object
          required:
          - name
          additionalProperties: false
          properties:
            name:
              type: string
            description:
              type: string
            parameters:
              type: object
      additionalProperties: false
    ToolCall:
      type: object
      required:
      - id
      - type
      - function
      properties:
        id:
          type: string
        type:
          type: string
          const: function
        function:
          type: object
          required:
          - name
          - arguments
          properties:
            name:
              type: string
            arguments:
              type: string
          additionalProperties: false
      additionalProperties: false
    ChatMessage:
      type: object
      required:
      - role
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - system
          - user
          - assistant
          - tool
        content:
          type:
          - string
          - 'null'
          description: V1 canonical content is text-only; null permitted for assistant tool-call messages.
        name:
          type: string
        tool_call_id:
          type: string
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
    ChatCompletionRequest:
      type: object
      required:
      - model
      - messages
      additionalProperties: false
      properties:
        model:
          type: string
          minLength: 1
          description: Tenant-visible alias or concrete public model identifier. Successful response model echoes this exact
            value.
        messages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          minimum: 0
          maximum: 1
        max_tokens:
          type: integer
          minimum: 1
          description: Legacy-compatible output token limit where supported by frozen compatibility profile.
        max_completion_tokens:
          type: integer
          minimum: 1
          description: Canonical output token limit.
        stop:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolDefinition'
        tool_choice: {}
        user:
          type: string
          description: External correlation metadata only; never authentication/tenant identity.
    Usage:
      type: object
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
    ChatCompletionResponse:
      type: object
      required:
      - id
      - object
      - created
      - model
      - choices
      additionalProperties: false
      properties:
        id:
          type: string
        object:
          type: string
          const: chat.completion
        created:
          type: integer
        model:
          type: string
          description: Exact public identifier supplied in request.model; never hidden provider model/deployment.
        choices:
          type: array
          items:
            type: object
            required:
            - index
            - message
            properties:
              index:
                type: integer
                minimum: 0
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type:
                - string
                - 'null'
                enum:
                - stop
                - length
                - tool_calls
                - content_filter
                - function_call
                - null
        usage:
          oneOf:
