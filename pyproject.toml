[project]
name = "enterprise-ai-api-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hashi Moto", email = "138295110+h-hamedani@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=46.0.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uuid-utils>=1.0.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
enterprise-ai-api-gateway = "enterprise_ai_api_gateway:main"
gateway-security = "app.cli:main"


[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
[tool.uv]
package = false
